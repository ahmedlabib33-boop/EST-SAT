<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Exam Arena — EST · SAT with Ahmed Labib</title>
<meta name="description" content="Timed practice exams from the question bank, with warnings, automatic collection and a review of where your time went.">
<meta name="theme-color" content="#07070F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<script>document.documentElement.classList.add('js');</script>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="one-screen">
<div class="space" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span></div>
<header class="nav" data-app-header></header>

<main id="top" class="wrap page">
  <section class="page-head">
    <p class="eyebrow">Exam Arena</p>
    <h1>Pressure makes <span class="grad-text">the plan real.</span></h1>
    <p class="lede">Strict timing, warnings when time is short, and the paper is collected automatically when the clock runs out. Practice questions from our own bank, not official papers.</p>
  </section>
  <div id="arena"></div>
</main>

<script src="assets/auth.js"></script>
<script src="assets/study.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var E = window.EstSat, S = window.EstSatStudy, A = window.App, el = A.el;
  var RUN_KEY = 'estsat.examRun', PAPER_KEY = 'estsat.examPaper';
  var FAST_SECONDS = 20, WARNINGS = [15 * 60, 5 * 60];
  // Mock papers run as several timed sections with a break between them, the way a real
  // sitting goes. The shape and the pacing follow the digital SAT; the questions are ours.
  var PAPERS = [
    { id: 'sat', short: 'Full', name: 'Full mock',
      note: 'Two English modules and two Math modules, in the shape of the digital SAT. 98 questions, about 2 hours 15.',
      sections: [
        { label: 'English module 1', subject: 'english', count: 27, seconds: 32 * 60 },
        { label: 'English module 2', subject: 'english', count: 27, seconds: 32 * 60 },
        { label: 'Math module 1', subject: 'math', count: 22, seconds: 35 * 60 },
        { label: 'Math module 2', subject: 'math', count: 22, seconds: 35 * 60 }
      ] },
    { id: 'half', short: 'Half', name: 'Half mock',
      note: 'One English module and one Math module, for an evening rather than a morning. 49 questions, about 1 hour 10.',
      sections: [
        { label: 'English module', subject: 'english', count: 27, seconds: 32 * 60 },
        { label: 'Math module', subject: 'math', count: 22, seconds: 35 * 60 }
      ] },
    { id: 'physics', short: 'Physics', name: 'Physics mock',
      note: 'Two physics sections, mechanics and electricity through to modern physics. 40 questions, 50 minutes.',
      sections: [
        { label: 'Physics section 1', subject: 'physics', count: 20, seconds: 25 * 60 },
        { label: 'Physics section 2', subject: 'physics', count: 20, seconds: 25 * 60 }
      ] }
  ];
  // A Challenge paper asks the harder questions and gives exam pace rather than practice pace.
  var LEVELS = {
    standard: { label: 'Standard', seconds: 90, difficulty: '', note: 'A mix of everything.' },
    challenge: { label: 'Challenge', seconds: 75, difficulty: 'hard,medium',
                 note: 'The hardest questions in the bank, at exam pace.' }
  };
  var state = null, run = null, paper = null, ticker = null;
  var setup = { mode: 'quick', subject: 'mixed', count: 40, level: 'standard', paper: 'sat' };
  function perQuestion() { return LEVELS[setup.level].seconds; }
  function paperById(id) {
    return PAPERS.filter(function (p) { return p.id === id; })[0] || PAPERS[0];
  }
  function mergeInto(target, extra) {
    Object.keys(extra).forEach(function (k) { target[k] = extra[k]; });
    return target;
  }

  function saveRun() {
    try { if (run) sessionStorage.setItem(RUN_KEY, JSON.stringify(run)); else sessionStorage.removeItem(RUN_KEY); } catch (e) { /* the exam just can't survive a reload */ }
  }
  function restoreRun() {
    try {
      var saved = JSON.parse(sessionStorage.getItem(RUN_KEY));
      if (saved && saved.questions && saved.questions.length) return saved;
    } catch (e) { /* start fresh */ }
    return null;
  }
  function savePaper() {
    try {
      if (paper) sessionStorage.setItem(PAPER_KEY, JSON.stringify(paper));
      else sessionStorage.removeItem(PAPER_KEY);
    } catch (e) { /* the paper just can't survive a reload */ }
  }
  function restorePaper() {
    try {
      var saved = JSON.parse(sessionStorage.getItem(PAPER_KEY));
      if (saved && saved.sections && saved.sections.length) return saved;
    } catch (e) { /* start fresh */ }
    return null;
  }
  function leaveGuard(e) { e.preventDefault(); e.returnValue = ''; }

  // ---------- Setup ----------
  function group(label) {
    var g = el('div', 'modes');
    g.setAttribute('role', 'group');
    g.setAttribute('aria-label', label);
    return g;
  }
  function quickBody(body) {
    var subjectGroup = group('Subject'), countGroup = group('Number of questions'), levelGroup = group('Paper');
    var summary = el('p', 'muted');
    function paintSummary() {
      summary.textContent = A.subjectLabel(setup.subject) + ' · ' + setup.count + ' questions · '
        + Math.round(setup.count * perQuestion() / 60) + ' minutes · ' + perQuestion() + 's each. '
        + LEVELS[setup.level].note;
    }
    A.modes(subjectGroup, [['mixed', 'Mixed'], ['math', 'Math'], ['english', 'English'], ['physics', 'Physics']], setup.subject, function (v) { setup.subject = v; paintSummary(); });
    A.modes(countGroup, [[20, '20 questions'], [40, '40 questions'], [60, '60 questions']], setup.count, function (v) { setup.count = v; paintSummary(); });
    A.modes(levelGroup, [['standard', 'Standard'], ['challenge', 'Challenge']], setup.level, function (v) { setup.level = v; paintSummary(); });
    body.appendChild(el('label', 'mini-label', 'Subject'));
    body.appendChild(subjectGroup);
    body.appendChild(el('label', 'mini-label', 'Length'));
    body.appendChild(countGroup);
    body.appendChild(el('label', 'mini-label', 'Paper'));
    body.appendChild(levelGroup);
    paintSummary();
    body.appendChild(summary);
    var go = el('button', 'btn btn-primary', 'Start the exam');
    go.type = 'button';
    go.addEventListener('click', function () { start(go); });
    body.appendChild(go);
  }
  function mockBody(body) {
    var pick = group('Mock paper'), plan = el('div', 'mock-plan');
    function paintPlan() {
      var chosen = paperById(setup.paper);
      A.clear(plan);
      plan.appendChild(el('p', 'muted', chosen.note));
      var list = el('ol', 'mock-sections');
      chosen.sections.forEach(function (s) {
        var li = el('li');
        li.appendChild(el('strong', null, s.label));
        li.appendChild(el('span', null, s.count + ' questions · ' + Math.round(s.seconds / 60) + ' min'));
        list.appendChild(li);
      });
      plan.appendChild(list);
      plan.appendChild(el('p', 'fine', 'Each section has its own clock, with a break in between. Once a section is handed in you cannot go back to it.'));
    }
    A.modes(pick, PAPERS.map(function (chosen) { return [chosen.id, chosen.short]; }), setup.paper, function (v) { setup.paper = v; paintPlan(); });
    body.appendChild(el('label', 'mini-label', 'Mock paper'));
    body.appendChild(pick);
    paintPlan();
    body.appendChild(plan);
    var go = el('button', 'btn btn-primary', 'Start the mock');
    go.type = 'button';
    go.addEventListener('click', function () { startMock(go); });
    body.appendChild(go);
  }
  function renderSetup() {
    var box = A.clear(A.byId('arena'));
    var card = el('div', 'card tool-card exam-setup');
    card.appendChild(el('h2', null, 'Set up your exam'));
    var modeGroup = group('Kind of exam');
    var body = el('div', 'setup-body');
    A.modes(modeGroup, [['quick', 'Quick exam'], ['mock', 'Full mock']], setup.mode, function (v) {
      setup.mode = v;
      A.clear(body);
      (v === 'mock' ? mockBody : quickBody)(body);
    });
    card.appendChild(modeGroup);
    card.appendChild(body);
    (setup.mode === 'mock' ? mockBody : quickBody)(body);
    box.appendChild(card);

    if (state && state.attempts.length) {
      var past = el('div', 'card tool-card');
      past.appendChild(el('h2', null, 'Your recent exams'));
      past.appendChild(attemptsTable(state.attempts.slice(0, 3)));
      box.appendChild(past);
    }
  }
  function levelTag(level) {
    return level === 'challenge' ? ' · Challenge' : level === 'mock' ? ' · Mock' : '';
  }
  function attemptsTable(rows) {
    var table = el('table', 'score-table');
    var head = el('tr');
    ['Date', 'Paper', 'Score', 'Time'].forEach(function (h) { var th = el('th', null, h); th.scope = 'col'; head.appendChild(th); });
    table.appendChild(head);
    rows.forEach(function (a) {
      var tr = el('tr');
      tr.appendChild(el('td', null, A.formatDate(a.date)));
      tr.appendChild(el('td', null, A.subjectLabel(a.subject) + levelTag(a.level)));
      tr.appendChild(el('td', null, a.score + '/' + a.total + ' (' + a.percent + '%)'));
      tr.appendChild(el('td', null, A.clock(a.seconds)));
      table.appendChild(tr);
    });
    return table;
  }

  function start(btn) {
    btn.disabled = true;
    btn.textContent = 'Preparing your paper…';
    var level = LEVELS[setup.level];
    var query = '/practice/random?subject=' + (setup.subject === 'mixed' ? 'all' : setup.subject) + '&n=' + setup.count
      + (level.difficulty ? '&difficulty=' + level.difficulty : '');
    E.api(query, { auth: false }).then(function (res) {
      var questions = res.questions || [];
      if (!questions.length) throw new Error('empty');
      var total = questions.length * level.seconds;
      paper = null;
      savePaper();
      run = { subject: setup.subject, level: setup.level, questions: questions, answers: {}, flags: {}, spent: {}, index: 0, total: total, deadline: Date.now() + total * 1000, warned: [] };
      saveRun();
      renderRun();
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = 'Start the exam';
      A.toast('Could not load the exam. Check your connection and try again.');
    });
  }

  // ---------- Mock papers ----------
  // The whole paper is fetched before the first section starts, so no question can turn
  // up twice and a section never waits on the network once the clock is running.
  function startMock(btn) {
    btn.disabled = true;
    btn.textContent = 'Preparing your paper…';
    var chosen = paperById(setup.paper);
    var need = {}, subjects = [];
    chosen.sections.forEach(function (s) {
      if (!need[s.subject]) subjects.push(s.subject);
      need[s.subject] = (need[s.subject] || 0) + s.count;
    });
    Promise.all(subjects.map(function (subject) {
      return E.api('/practice/random?subject=' + subject + '&n=' + need[subject], { auth: false });
    })).then(function (parts) {
      var pools = {};
      subjects.forEach(function (subject, i) { pools[subject] = (parts[i].questions || []).slice(); });
      var sections = chosen.sections.map(function (s) {
        return { label: s.label, subject: s.subject, seconds: s.seconds, questions: pools[s.subject].splice(0, s.count) };
      });
      if (sections.some(function (s) { return !s.questions.length; })) throw new Error('empty');
      paper = { id: chosen.id, name: chosen.name, index: 0, sections: sections, done: [],
                results: [], questions: [], answers: {}, byId: {}, used: 0, allowed: 0 };
      savePaper();
      startSection(0);
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = 'Start the mock';
      A.toast('Could not load the paper. Check your connection and try again.');
    });
  }
  function startSection(index) {
    var s = paper.sections[index];
    paper.index = index;
    savePaper();
    run = { subject: s.subject, level: 'mock', section: index, label: s.label, questions: s.questions,
            answers: {}, flags: {}, spent: {}, index: 0, total: s.seconds,
            deadline: Date.now() + s.seconds * 1000, warned: [] };
    saveRun();
    renderRun();
  }
  function renderBreak() {
    clearInterval(ticker);
    window.removeEventListener('beforeunload', leaveGuard);
    var box = A.clear(A.byId('arena'));
    var card = el('div', 'card tool-card');
    var last = paper.done[paper.done.length - 1];
    var next = paper.sections[paper.index + 1];
    card.appendChild(el('p', 'eyebrow', 'Section handed in'));
    card.appendChild(el('h2', null, last.label + ': ' + last.score + ' / ' + last.total));
    card.appendChild(el('p', 'muted', 'Take a short break. You cannot go back to that section, and the next one starts on a fresh clock.'));
    card.appendChild(el('p', null, 'Next: ' + next.label + ' · ' + next.questions.length + ' questions · '
      + Math.round(next.seconds / 60) + ' minutes'));
    var go = el('button', 'btn btn-primary', 'Start the next section');
    go.type = 'button';
    go.addEventListener('click', function () { startSection(paper.index + 1); });
    card.appendChild(go);
    var stop = el('button', 'link-btn', 'Stop here and mark what I have done');
    stop.type = 'button';
    stop.addEventListener('click', function () { finishPaper(); });
    card.appendChild(stop);
    box.appendChild(card);
  }
  // Builds one result out of the sections that were sat, and records a single exam.
  function finishPaper() {
    var done = paper, score = 0, total = 0;
    done.done.forEach(function (s) { score += s.score; total += s.total; });
    var percent = total ? Math.round(score * 100 / total) : 0;
    var graded = { score: score, total: total, percent: percent };
    var finished = { questions: done.questions, answers: done.answers, total: done.allowed,
                     level: 'mock', name: done.name, sections: done.done };
    S.recordExam(state, { subject: 'mixed', level: 'mock', score: score, total: total, percent: percent,
                          seconds: done.used, results: done.results });
    A.commit(state);
    S.celebrate(percent >= 70);
    paper = null;
    savePaper();
    renderResults(finished, graded, done.byId, done.results, done.used);
  }
  // ---------- Sitting the exam ----------
  function secondsLeft() { return Math.max(0, (run.deadline - Date.now()) / 1000); }
  function answeredCount() { return Object.keys(run.answers).length; }

  function renderRun() {
    window.addEventListener('beforeunload', leaveGuard);
    var box = A.clear(A.byId('arena'));
    var warn = el('div', 'exam-warning');
    warn.id = 'examWarning';
    warn.setAttribute('role', 'alert');
    warn.hidden = true;
    box.appendChild(warn);
    var stage = el('div', 'exam-stage');
    var main = el('section', 'card tool-card');
    main.id = 'examQuestion';
    stage.appendChild(main);
    var side = el('aside', 'card tool-card exam-side');
    side.setAttribute('aria-label', 'Exam progress');
    if (run.label && paper) {
      side.appendChild(el('p', 'eyebrow', run.label + ' · ' + (run.section + 1) + ' of ' + paper.sections.length));
    }
    var clock = el('div', 'exam-clock');
    clock.id = 'examClock';
    clock.setAttribute('role', 'timer');
    side.appendChild(clock);
    var count = el('p', 'muted');
    count.id = 'examCount';
    side.appendChild(count);
    var palette = el('div', 'palette');
    palette.id = 'palette';
    palette.setAttribute('role', 'group');
    palette.setAttribute('aria-label', 'Jump to a question');
    side.appendChild(palette);
    var finish = el('button', 'btn btn-primary btn-sm', run.label ? 'Hand in this section' : 'Finish exam');
    finish.type = 'button';
    finish.addEventListener('click', function () {
      var blank = run.questions.length - answeredCount();
      var what = run.label ? 'Hand the section in anyway?' : 'Finish anyway?';
      if (blank && !window.confirm(blank + ' question' + (blank === 1 ? ' is' : 's are') + ' still blank. ' + what)) return;
      submit();
    });
    side.appendChild(finish);
    stage.appendChild(side);
    box.appendChild(stage);
    paintQuestion();
    tick();
    ticker = setInterval(tick, 1000);
  }

  function tick() {
    if (!run) return;
    var left = secondsLeft(), q = run.questions[run.index];
    run.spent[q.id] = (run.spent[q.id] || 0) + 1;
    var clock = A.byId('examClock');
    clock.textContent = A.clock(left);
    clock.classList.toggle('low', left < 300);
    WARNINGS.forEach(function (mark) {
      if (run.total > mark && left <= mark && run.warned.indexOf(mark) < 0) {
        run.warned.push(mark);
        showWarning(mark === 300 ? '5 minutes left. Fill in any blanks now.' : '15 minutes left. Answer every remaining question, even with a best guess.');
      }
    });
    saveRun();
    if (left <= 0) submit();
  }
  function showWarning(text) {
    var w = A.byId('examWarning');
    w.textContent = text;
    w.hidden = false;
    S.vibrate([80, 60, 80]);
  }

  function paintPalette() {
    var box = A.clear(A.byId('palette'));
    run.questions.forEach(function (q, i) {
      var b = el('button', 'pal-btn', i + 1);
      b.type = 'button';
      var marks = [];
      if (run.answers[q.id]) { b.classList.add('answered'); marks.push('answered'); }
      if (run.flags[q.id]) { b.classList.add('flagged'); marks.push('flagged'); }
      if (i === run.index) b.setAttribute('aria-current', 'true');
      b.setAttribute('aria-label', 'Question ' + (i + 1) + (marks.length ? ', ' + marks.join(' and ') : ''));
      b.addEventListener('click', function () { run.index = i; paintQuestion(); });
      box.appendChild(b);
    });
    A.byId('examCount').textContent = answeredCount() + ' of ' + run.questions.length + ' answered';
  }

  function paintQuestion() {
    var box = A.clear(A.byId('examQuestion')), q = run.questions[run.index];
    box.appendChild(el('p', 'eyebrow', A.subjectLabel(q.subject) + (q.topic ? ' · ' + q.topic : '')));
    box.appendChild(el('h2', 'exam-num', 'Question ' + (run.index + 1) + ' of ' + run.questions.length));
    box.appendChild(el('p', 'q-text', q.question));
    var opts = el('div', 'opts');
    (q.choices || []).forEach(function (c) {
      var b = el('button', 'opt' + (run.answers[q.id] === c.id ? ' selected' : ''));
      b.type = 'button';
      b.setAttribute('aria-pressed', run.answers[q.id] === c.id ? 'true' : 'false');
      b.setAttribute('aria-label', 'Answer ' + c.id + ': ' + c.text);
      var letter = el('span', 'letter', c.id);
      letter.setAttribute('aria-hidden', 'true');
      b.appendChild(letter);
      b.appendChild(el('span', 'txt', c.text));
      b.addEventListener('click', function () {
        if (run.answers[q.id] === c.id) delete run.answers[q.id]; else run.answers[q.id] = c.id;
        saveRun();
        paintQuestion();
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    var row = el('div', 'exam-nav');
    var prev = el('button', 'btn btn-ghost btn-sm', 'Previous');
    prev.type = 'button';
    prev.disabled = run.index === 0;
    prev.addEventListener('click', function () { run.index -= 1; paintQuestion(); });
    var flag = el('button', 'btn btn-ghost btn-sm flag-btn', run.flags[q.id] ? 'Flagged' : 'Flag for later');
    flag.type = 'button';
    flag.setAttribute('aria-pressed', run.flags[q.id] ? 'true' : 'false');
    flag.addEventListener('click', function () {
      if (run.flags[q.id]) delete run.flags[q.id]; else run.flags[q.id] = true;
      saveRun();
      paintQuestion();
    });
    var next = el('button', 'btn btn-ghost btn-sm', 'Next');
    next.type = 'button';
    next.disabled = run.index >= run.questions.length - 1;
    next.addEventListener('click', function () { run.index += 1; paintQuestion(); });
    row.appendChild(prev);
    row.appendChild(flag);
    row.appendChild(next);
    box.appendChild(row);
    paintPalette();
  }

  // ---------- Results ----------
  function submit() {
    if (!run || run.submitting) return;
    run.submitting = true;
    clearInterval(ticker);
    var used = Math.round(run.total - secondsLeft());
    var box = A.clear(A.byId('arena'));
    box.appendChild(el('p', 'muted', 'Collecting your paper…'));
    var items = run.questions.map(function (q) { return { id: q.id, answer: run.answers[q.id] || '' }; });
    E.api('/practice/grade', { method: 'POST', auth: false, body: { items: items } }).then(function (graded) {
      var byId = {};
      graded.results.forEach(function (r) { byId[r.id] = r; });
      var results = run.questions.map(function (q) {
        var r = byId[q.id] || {};
        return { id: q.id, subject: q.subject, topic: q.topicId, topicName: q.topic, correct: !!r.correct, answered: !!run.answers[q.id], seconds: run.spent[q.id] || 0 };
      });
      if (paper && run.section !== undefined) {
        paper.done.push({ label: run.label, score: graded.score, total: graded.total, percent: graded.percent, seconds: used });
        paper.results = paper.results.concat(results);
        paper.questions = paper.questions.concat(run.questions);
        mergeInto(paper.answers, run.answers);
        mergeInto(paper.byId, byId);
        paper.used += used;
        paper.allowed += run.total;
        var more = paper.index + 1 < paper.sections.length;
        window.removeEventListener('beforeunload', leaveGuard);
        run = null;
        saveRun();
        savePaper();
        if (more) renderBreak(); else finishPaper();
        return;
      }
      S.recordExam(state, { subject: run.subject, level: run.level, score: graded.score, total: graded.total, percent: graded.percent, seconds: used, results: results });
      A.commit(state);
      S.celebrate(graded.percent >= 70);
      window.removeEventListener('beforeunload', leaveGuard);
      var finished = run;
      run = null;
      saveRun();
      renderResults(finished, graded, byId, results, used);
    }).catch(function () {
      run.submitting = false;
      A.clear(box);
      var card = el('div', 'card tool-card');
      card.appendChild(el('h2', null, 'Your answers are safe.'));
      card.appendChild(el('p', 'muted', 'We could not reach the server to mark the paper. Check your connection and try again.'));
      var retry = el('button', 'btn btn-primary btn-sm', 'Try again');
      retry.type = 'button';
      retry.addEventListener('click', submit);
      card.appendChild(retry);
      box.appendChild(card);
    });
  }

  function renderResults(finished, graded, byId, results, used) {
    var box = A.clear(A.byId('arena'));
    var head = el('div', 'card tool-card done-card');
    head.appendChild(A.ring(graded.percent, graded.percent + '%'));
    var t = el('div');
    t.appendChild(el('p', 'eyebrow', finished.sections ? finished.name + ' finished' : 'Exam submitted'));
    t.appendChild(el('h2', null, graded.score + ' / ' + graded.total + ' correct'));
    var wrong = results.filter(function (r) { return !r.correct; }).length;
    t.appendChild(el('p', 'muted', wrong + ' question' + (wrong === 1 ? ' is' : 's are') + ' now in your Review Vault, and will come back in your daily session.'));
    var again = el('button', 'btn btn-ghost btn-sm', 'New exam');
    again.type = 'button';
    again.addEventListener('click', renderSetup);
    var vault = el('a', 'btn btn-ghost btn-sm', 'Open Review Vault');
    vault.href = 'review.html';
    var row = el('div', 'exam-nav');
    row.appendChild(again);
    row.appendChild(vault);
    t.appendChild(row);
    head.appendChild(t);
    box.appendChild(head);
    if (finished.sections) box.appendChild(sectionReview(finished.sections));
    var time = timeReview(finished, results, used), checks = answerReview(finished, byId);
    time.id = 'resultTime';
    time.setAttribute('data-view', 'Your time');
    checks.id = 'resultAnswers';
    checks.setAttribute('data-view', 'Your answers');
    A.tabs(box, 'Exam results', [checks, time]);
    var list = el('div', 'answer-list'), items = Array.prototype.slice.call(checks.querySelectorAll('.answer-item'));
    items.forEach(function (item) { checks.removeChild(item); });
    checks.appendChild(list);
    A.pager(list, [4, 12, 6]).set(items);
  }

  function sectionReview(sections) {
    var card = el('section', 'card tool-card');
    card.appendChild(el('h2', null, 'Section by section'));
    var table = el('table', 'score-table'), head = el('tr');
    ['Section', 'Score', 'Percent', 'Time'].forEach(function (h) {
      var th = el('th', null, h);
      th.scope = 'col';
      head.appendChild(th);
    });
    table.appendChild(head);
    sections.forEach(function (s) {
      var tr = el('tr');
      tr.appendChild(el('td', null, s.label));
      tr.appendChild(el('td', null, s.score + '/' + s.total));
      tr.appendChild(el('td', null, s.percent + '%'));
      tr.appendChild(el('td', null, A.clock(s.seconds)));
      table.appendChild(tr);
    });
    card.appendChild(table);
    return card;
  }

  function timeReview(finished, results, used) {
    // A mock has a different clock in each section, so the pace to beat is the paper's average.
    var target = finished.sections
      ? Math.round(finished.total / Math.max(1, finished.questions.length))
      : LEVELS[finished.level === 'challenge' ? 'challenge' : 'standard'].seconds;
    var card = el('section', 'card tool-card');
    card.appendChild(el('h2', null, 'Where your time went'));
    var blank = results.filter(function (r) { return !r.answered; }).length;
    var average = results.length ? used / results.length : 0;
    var stats = el('div', 'stat-row');
    [[A.clock(used), 'time used of ' + A.clock(finished.total)], [A.clock(average), 'per question (target ' + A.clock(target) + ')'], [blank, 'left blank']].forEach(function (s) {
      var k = el('div', 'kpi');
      k.appendChild(el('b', null, s[0]));
      k.appendChild(el('span', null, s[1]));
      stats.appendChild(k);
    });
    card.appendChild(stats);
    card.appendChild(el('p', 'muted', average > target
      ? 'You were behind the pace. Move on once you pass the target time, and come back to the hard ones at the end.'
      : 'Good pace. Use any spare time to re-check your working.'));

    var topics = {};
    results.forEach(function (r) {
      var name = r.topicName || A.subjectLabel(r.subject);
      var row = topics[name] || (topics[name] = { name: name, seconds: 0, right: 0, count: 0 });
      row.seconds += r.seconds; row.count += 1; if (r.correct) row.right += 1;
    });
    var rows = Object.keys(topics).map(function (k) { return topics[k]; }).sort(function (a, b) { return b.seconds - a.seconds; });
    var longest = rows.length ? Math.max(1, rows[0].seconds) : 1;
    var bars = el('div', 'time-bars'), lines = [];
    rows.forEach(function (row) {
      var line = el('div', 'time-row');
      line.appendChild(el('span', null, row.name));
      line.appendChild(A.meter(row.seconds / longest));
      line.appendChild(el('b', null, A.clock(row.seconds) + ' · ' + row.right + '/' + row.count));
      lines.push(line);
    });
    card.appendChild(bars);
    A.pager(bars, [4, 12, 5]).set(lines);

    var numbered = results.map(function (r, i) { r.number = i + 1; return r; });
    card.appendChild(el('h3', 'sub-head', 'Slowest questions'));
    var slow = el('ul', 'slow-list');
    numbered.slice().sort(function (a, b) { return b.seconds - a.seconds; }).slice(0, 5).forEach(function (r) {
      var li = el('li');
      li.appendChild(el('span', null, 'Q' + r.number));
      li.appendChild(el('b', null, A.clock(r.seconds)));
      li.appendChild(el('em', r.correct ? 'right' : 'wrong', r.correct ? 'right' : 'wrong'));
      slow.appendChild(li);
    });
    card.appendChild(slow);
    var rushed = numbered.filter(function (r) { return r.answered && !r.correct && r.seconds < FAST_SECONDS; });
    if (rushed.length) {
      card.appendChild(el('p', 'fine', 'Rushed and wrong (under ' + FAST_SECONDS + ' seconds): ' + rushed.map(function (r) { return 'Q' + r.number; }).join(', ') + '. Slow down on these types.'));
    }
    return card;
  }

  function answerReview(finished, byId) {
    var card = el('section', 'card tool-card');
    card.appendChild(el('h2', null, 'Check your answers'));
    finished.questions.forEach(function (q, i) {
      var r = byId[q.id] || {}, mine = finished.answers[q.id];
      var item = el('details', 'answer-item' + (r.correct ? ' right' : ''));
      var sum = el('summary');
      sum.appendChild(el('span', 'answer-mark', r.correct ? 'Right' : mine ? 'Wrong' : 'Blank'));
      sum.appendChild(el('span', null, (i + 1) + '. ' + q.question));
      item.appendChild(sum);
      (q.choices || []).forEach(function (c) {
        var line = el('p', 'answer-line' + (c.id === r.answer ? ' is-answer' : c.id === mine ? ' is-mine' : ''));
        line.textContent = c.id + '. ' + c.text + (c.id === r.answer ? '  (correct)' : c.id === mine ? '  (your answer)' : '');
        item.appendChild(line);
      });
      if (r.explanation && r.explanation.length) item.appendChild(el('p', 'muted', r.explanation.join(' ')));
      card.appendChild(item);
    });
    return card;
  }

  // ---------- Start ----------
  // A parent can assign an exam as "<subject>-<count>", for example mixed-40, and may add
  // "-challenge" to set the harder paper.
  var preset = /^(mixed|math|english|physics)-(20|40|60)(-challenge)?$/.exec(A.param('preset'));
  if (preset) {
    setup.subject = preset[1];
    setup.count = Number(preset[2]);
    if (preset[3]) setup.level = 'challenge';
  }

  A.boot(function (s) {
    state = s;
    if (run) return;
    paper = restorePaper();
    var saved = restoreRun();
    if (saved) {
      run = saved;
      run.submitting = false;
      if (secondsLeft() <= 0) { submit(); return; }
      renderRun();
      return;
    }
    // Reloaded during a break: pick the paper up where it stopped.
    if (paper && paper.done.length && paper.index + 1 < paper.sections.length) { renderBreak(); return; }
    if (paper) { paper = null; savePaper(); }
    renderSetup();
  });
})();
</script>
</body>
